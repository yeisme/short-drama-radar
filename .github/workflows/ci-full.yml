# Initial project-owned scaffold from Yeisme modular CI rollout.
name: Full CI

on:
  pull_request:
    paths:
      - '.github/**'
      - 'go.mod'
      - 'go.sum'
      - 'package.json'
      - 'bun.lock'
      - 'pnpm-lock.yaml'
      - 'Taskfile.yml'
      - '.goreleaser.yaml'
      - '.golangci.yml'
      - 'openspec/**'
      - '**/migrations/**'
      - '**/schema/**'
      - '**/contracts/**'
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Run full gate
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test
          RADAR_FIXTURE_DIR=test/fixtures bun run src/cli.ts run --json
